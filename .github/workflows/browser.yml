name: Browser game

on:
  push:
    branches: [main, 'codex/**']
    paths: ['web/**', 'original/**', 'tools/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', 'requirements.txt', '.github/workflows/browser.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: python -m pip install -r requirements.txt
      - name: Original data, scripts and artwork
        run: |
          python tools/fetch_scummvm_web.py --verify
          python tools/jones.py verify
          pnpm test
      - name: Build static distribution
        run: python tools/build_browser.py
      - name: Original game controls, saves and fullscreen display
        run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: reports/browser-local/
      - uses: actions/upload-artifact@v4
        with:
          name: jones-browser-0.2.0
          path: build/jones-browser-0.2.0.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/browser
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified browser build
        id: deployment
        uses: actions/deploy-pages@v4
