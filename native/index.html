<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><link rel="icon" href="data:,"/><title>Jones in the Fast Lane</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="screen">
  <div id="stage"><canvas id="game" width="320" height="200" tabindex="0" aria-label="Jones in the Fast Lane"></canvas></div>
  <section id="launch" class="overlay"><div class="panel"><h1>Jones in the Fast Lane</h1><p id="loading" role="status">Loading…</p><button id="play" disabled>Play in fullscreen</button><button id="online" disabled>Play online</button></div></section>
  <nav id="display-controls" aria-label="Display"><button id="fullscreen" aria-label="Fullscreen">⛶</button><button id="settings">Display</button></nav>
  <dialog id="display"><form method="dialog"><h2>Display</h2><label>Style <select id="mode"><option value="original">Original pixels</option><option value="smooth">Smooth</option><option value="modern">Modern</option><option value="crt">CRT</option></select></label><label>Resolution <select id="resolution"><option value="0">Automatic</option><option value="720">720p</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">2160p</option></select></label><button>Done</button></form></dialog>
  <dialog id="network"><div class="panel"><h2>Play online</h2><button id="resume-online" hidden>Resume online game</button><label>Server <input id="server" spellcheck="false" value="ws://127.0.0.1:8787/multiplayer"></label><label>Players <select id="players"><option>2</option><option>3</option><option>4</option><option>1</option></select></label><button id="create">Create game</button><label>Invitation <input id="invitation" spellcheck="false" placeholder="Paste an invitation link"></label><button id="join">Join game</button><p id="connection" role="status"></p><label id="invite-label" hidden>Share this invitation <input id="invite-link" readonly></label><button id="start-online" hidden>Start game</button><button id="close-online">Back</button></div></dialog>
  <div id="network-status" role="status" hidden></div>
  <section id="failure" class="overlay" hidden><div class="panel"><h2>The game stopped</h2><p id="error" role="alert"></p><button id="reload">Reload</button></div></section>
</main><script type="module" src="./app.ts"></script></body></html>
