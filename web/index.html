<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Jones in the Fast Lane, running its original game scripts in your browser.">
  <title>Jones in the Fast Lane</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="screen" aria-label="Jones in the Fast Lane">
    <div id="stage">
      <canvas id="canvas" width="320" height="200" tabindex="0" aria-label="Original Jones in the Fast Lane game. Use the mouse and original keyboard controls."></canvas>
      <canvas id="display" width="320" height="200" aria-hidden="true"></canvas>
    </div>
    <div id="launch">
      <h1>Jones in the Fast Lane</h1>
      <button id="start">Play in fullscreen</button>
      <p id="status" role="status">Original game. Original controls.</p>
      <p class="launch-hint">Press Esc to leave fullscreen.</p>
    </div>
    <div id="tools" aria-label="Display controls">
      <button id="fullscreen" title="Enter fullscreen" aria-label="Enter fullscreen">⛶</button>
      <button id="display-options" title="Display options" aria-label="Display options">⚙</button>
    </div>
    <div id="notice" role="status" hidden></div>
  <dialog id="settings">
    <form method="dialog"><header><h2>Display</h2><button id="close-settings" aria-label="Close display options">×</button></header></form>
    <label for="mode">Picture</label>
    <select id="mode"><option value="classic">Original pixels</option><option value="smooth">Smooth scaling</option><option value="modern">Subtle light and color</option><option value="crt">CRT</option></select>
    <label for="resolution">Output resolution</label>
    <select id="resolution"><option value="auto">Fit this screen</option><option value="720">720p</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">2160p / 4K</option></select>
    <label for="intensity">Effect strength</label><input id="intensity" type="range" min="0" max="100" value="40">
    <p id="display-status"></p>
    <p class="hint">Display effects only. The original menus, controls and game rules stay unchanged.</p>
  </dialog>
  </main>
  <noscript>This game requires JavaScript and WebAssembly.</noscript>
</body>
</html>
